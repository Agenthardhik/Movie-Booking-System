<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BookNbite</title>

<link rel="stylesheet" href="intro.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Background -->

<div class="background"></div>

<!-- Floating Particles -->

<div class="particles">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<!-- Light -->

<div class="light"></div>

<!-- Floating Icons -->

<div class="icons">

<div class="icon film">
<i class="fa-solid fa-film"></i>
</div>

<div class="icon ticket">
<i class="fa-solid fa-ticket"></i>
</div>

<div class="icon popcorn">
🍿
</div>

<div class="icon drink">
🥤
</div>

<div class="icon camera">
<i class="fa-solid fa-video"></i>
</div>

</div>

<!-- Logo -->

<div class="logo">

<h1>

Book

<span>N</span>

bite

</h1>

<p>

Book • Watch • Bite

</p>

</div>

<!-- Loading -->

<div class="loader">

<div class="loading"></div>

</div>

<script src="intro.js"></script>
<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeLoginModal()">&times;</span>
    <h2 id="modalTitle">Sign In</h2>
    
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="input-group">
        <label for="userEmail">Email / Mobile</label>
        <input type="text" id="userEmail" placeholder="Enter email or phone" required>
      </div>

      <div class="input-group">
        <label for="userPassword">Password</label>
        <input type="password" id="userPassword" placeholder="Enter password" required>
      </div>

      <button type="submit" class="modal-submit-btn">Sign In</button>
    </form>
  </div>
</div>

</body>

</html>
