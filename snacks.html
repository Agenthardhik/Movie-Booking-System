<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookNbite - Snacks</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',Arial,sans-serif;
}

body{
background:#0f0f1a;
color:#fff;
min-height:100vh;
}

header{
background: linear-gradient(135deg, #d81f26 0%, #a01520 100%);
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow: 0 4px 20px rgba(216,31,38,0.3);
}

header h1{
font-size:22px;
font-weight:700;
}

.back-link{
color:white;
text-decoration:none;
font-size:14px;
opacity:0.8;
transition: opacity 0.2s;
}

.back-link:hover{ opacity:1; }

.container{
width:92%;
max-width:900px;
margin:30px auto;
padding-bottom:40px;
}

h2{
margin-bottom:20px;
font-weight:700;
}

.snack-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:16px;
margin-bottom:30px;
}

.snack-card{
background: rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.06);
padding:24px 16px;
border-radius:14px;
text-align:center;
transition:all 0.2s;
cursor:default;
backdrop-filter:blur(10px);
position:relative;
overflow:hidden;
}

.snack-card:hover{
background:rgba(255,255,255,0.08);
transform:translateY(-4px);
box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.snack-card .emoji{
font-size:48px;
margin-bottom:12px;
display:block;
}

.snack-card h3{
font-size:17px;
font-weight:600;
color:#fff;
margin-bottom:6px;
}

.snack-card .price{
font-size:18px;
font-weight:700;
color:#ffd700;
margin-bottom:14px;
}

.snack-card .qty-row{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:12px;
}

.snack-card .qty-btn{
width:30px;
height:30px;
border-radius:8px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.05);
color:#fff;
font-size:16px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:all 0.2s;
}

.snack-card .qty-btn:hover{
background:rgba(216,31,38,0.2);
border-color:#d81f26;
}

.snack-card .qty-val{
font-size:17px;
font-weight:700;
min-width:24px;
text-align:center;
}

.snack-card button.add-btn{
padding:9px 22px;
background: linear-gradient(135deg, #d81f26, #ff3b3b);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:all 0.2s;
box-shadow: 0 3px 12px rgba(216,31,38,0.2);
}

.snack-card button.add-btn:hover{
transform:scale(1.05);
box-shadow: 0 4px 18px rgba(216,31,38,0.4);
}

.snack-card.added{
border-color:rgba(76,175,80,0.3);
}

.snack-card.added::after{
content:'✓ Added';
position:absolute;
top:10px;
right:10px;
background:rgba(76,175,80,0.15);
color:#66bb6a;
padding:3px 10px;
border-radius:12px;
font-size:11px;
font-weight:600;
}

/* Bill Card */
.bill{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
padding:24px 28px;
margin-bottom:20px;
backdrop-filter:blur(10px);
}

.bill-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
font-size:16px;
}

.bill-row .label{
color:#999;
}

.bill-row .value{
font-weight:600;
color:#fff;
}

.bill-divider{
border:none;
border-top:1px solid rgba(255,255,255,0.08);
margin:10px 0;
}

.bill-total{
display:flex;
justify-content:space-between;
align-items:center;
font-size:22px;
font-weight:800;
color:#ffd700;
padding-top:8px;
}

button.proceed-btn{
display:block;
width:100%;
max-width:400px;
margin:0 auto;
padding:16px 28px;
background: linear-gradient(135deg, #d81f26, #ff3b3b);
color:white;
border:none;
border-radius:14px;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:all 0.3s;
box-shadow: 0 6px 25px rgba(216,31,38,0.3);
}

button.proceed-btn:hover{
transform:translateY(-2px);
box-shadow: 0 8px 35px rgba(216,31,38,0.4);
}

.skip-link{
display:block;
text-align:center;
margin-top:12px;
color:#888;
text-decoration:none;
font-size:14px;
transition:color 0.2s;
}

.skip-link:hover{
color:#fff;
}

@media(max-width:480px){
  .snack-grid{
    grid-template-columns:1fr 1fr;
  }
  header{
    flex-direction:column;
    gap:8px;
    text-align:center;
  }
}
</style>

</head>

<body>

<header>
  <a href="booking.html" class="back-link"><i class="fa fa-arrow-left"></i> Back</a>
  <h1>🍿 Add Snacks</h1>
  <div style="width:50px;"></div>
</header>

<div class="container">

<h2>Select Your Snacks</h2>

<div class="snack-grid">

<div class="snack-card" id="snack-popcorn">
  <span class="emoji">🍿</span>
  <h3>Popcorn</h3>
  <p class="price">₹250</p>
  <button class="add-btn" onclick="addSnack('snack-popcorn', 250, 'Popcorn')">Add to Order</button>
</div>

<div class="snack-card" id="snack-coke">
  <span class="emoji">🥤</span>
  <h3>Coke</h3>
  <p class="price">₹120</p>
  <button class="add-btn" onclick="addSnack('snack-coke', 120, 'Coke')">Add to Order</button>
</div>

<div class="snack-card" id="snack-pizza">
  <span class="emoji">🍕</span>
  <h3>Pizza</h3>
  <p class="price">₹350</p>
  <button class="add-btn" onclick="addSnack('snack-pizza', 350, 'Pizza')">Add to Order</button>
</div>

<div class="snack-card" id="snack-burger">
  <span class="emoji">🍔</span>
  <h3>Burger</h3>
  <p class="price">₹180</p>
  <button class="add-btn" onclick="addSnack('snack-burger', 180, 'Burger')">Add to Order</button>
</div>

<div class="snack-card" id="snack-nachos">
  <span class="emoji">🌮</span>
  <h3>Nachos</h3>
  <p class="price">₹200</p>
  <button class="add-btn" onclick="addSnack('snack-nachos', 200, 'Nachos')">Add to Order</button>
</div>

<div class="snack-card" id="snack-fries">
  <span class="emoji">🍟</span>
  <h3>French Fries</h3>
  <p class="price">₹150</p>
  <button class="add-btn" onclick="addSnack('snack-fries', 150, 'French Fries')">Add to Order</button>
</div>

</div>

<div class="bill">
  <div class="bill-row">
    <span class="label">🎟️ Ticket Total</span>
    <span class="value">₹<span id="ticket">0</span></span>
  </div>
  <div class="bill-row">
    <span class="label">🍿 Snacks Total</span>
    <span class="value">₹<span id="snack">0</span></span>
  </div>
  <hr class="bill-divider">
  <div class="bill-total">
    <span>Grand Total</span>
    <span>₹<span id="grand">0</span></span>
  </div>
</div>

<button class="proceed-btn" onclick="payment()">
  Proceed to Payment <i class="fa fa-arrow-right"></i>
</button>

<a href="payment.html" class="skip-link">Skip snacks →</a>

</div>

<script>

let ticketTotal = parseInt(localStorage.getItem("ticketTotal")) || 0;
let snackTotal = 0;

document.getElementById("ticket").textContent = ticketTotal;
document.getElementById("grand").textContent = ticketTotal;

// Save initial grand total (ticket only) in case user skips snacks
localStorage.setItem("grandTotal", ticketTotal);

function addSnack(cardId, price, name) {
  snackTotal += price;

  document.getElementById("snack").textContent = snackTotal;
  document.getElementById("grand").textContent = ticketTotal + snackTotal;

  localStorage.setItem("grandTotal", ticketTotal + snackTotal);

  // Visual feedback
  const card = document.getElementById(cardId);
  if (card) {
    card.classList.add("added");
    setTimeout(() => card.classList.remove("added"), 1500);
  }
}

function payment() {
  localStorage.setItem("grandTotal", ticketTotal + snackTotal);
  window.location = "payment.html";
}

</script>

</body>
</html>
